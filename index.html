<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สั่งอาหารออนไลน์ - Sapsong HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        #store-qr-box img, #store-qr-box canvas { margin: 0 auto; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-amber-50/40 min-h-screen pb-28">

    <!-- Lock Gate จาก Sapsong HUB -->
    <div id="sapsong-lock-overlay" class="hidden fixed inset-0 bg-slate-950 text-white z-[99999] flex flex-col justify-center items-center text-center p-6">
        <div class="bg-slate-900 border border-slate-700 max-w-md w-full p-8 rounded-3xl shadow-2xl space-y-3">
            <div class="text-5xl">🔒</div>
            <h2 id="sapsong-lock-title" class="text-xl font-bold">ปิดให้บริการชั่วคราว</h2>
            <p id="sapsong-lock-msg" class="text-sm text-slate-400">ระบบสั่งอาหารของร้านนี้ปิดให้บริการชั่วคราว</p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-amber-950 text-white shadow-md p-3.5 sm:p-4 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center gap-3 overflow-hidden">
                <img id="hdr-logo" src="" alt="Logo" class="hidden w-11 h-11 rounded-xl object-cover bg-white border border-amber-700 shrink-0">
                <div class="truncate">
                    <h1 id="hdr-title" class="text-base sm:text-xl font-bold truncate">กำลังโหลดข้อมูลร้าน...</h1>
                    <p id="hdr-status" class="text-[11px] text-amber-300 font-semibold">กำลังตรวจสอบสถานะร้าน...</p>
                </div>
            </div>
            <a id="hdr-receipt-link" href="receipt.html" class="bg-white/15 hover:bg-white/25 text-amber-100 text-xs font-bold px-3 py-2 rounded-xl shrink-0 transition">
                🧾 เช็กใบเสร็จ
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-3 sm:p-5 space-y-5">

        <!-- แถบค้นหา & หมวดหมู่ -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border space-y-3">
            <input type="text" id="search-menu" oninput="renderMenuGrid()" placeholder="🔍 ค้นหาเมนูอาหาร / เข่ง / เครื่องดื่ม..." class="w-full px-3.5 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500">
            <div id="category-pills" class="flex gap-2 overflow-x-auto pb-1"></div>
        </div>

        <!-- กริดรายการเมนู -->
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>

    </main>

    <!-- แถบตะกร้าด้านล่าง -->
    <div id="cart-bar" class="hidden fixed bottom-0 inset-x-0 bg-slate-900 text-white p-3.5 shadow-2xl border-t border-slate-700 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center gap-3">
            <div>
                <span class="text-xs bg-amber-400 text-slate-950 font-bold px-2.5 py-0.5 rounded-full">ตะกร้า <span id="cart-count">0</span> ชิ้น</span>
                <p id="cart-total-text" class="text-lg font-bold text-amber-300 mt-0.5">0 บาท</p>
            </div>
            <button onclick="openCheckoutModal()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm shadow-md transition">
                ไปหน้าสั่งซื้อ / ชำระเงิน →
            </button>
        </div>
    </div>

    <!-- Modal ตะกร้า & ชำระเงิน -->
    <div id="checkout-modal" onclick="this.classList.add('hidden')" class="hidden fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="bg-white rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl max-h-[92vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2.5">
                <h3 class="font-bold text-slate-800 text-base">🛒 สรุปรายการสั่งซื้อ</h3>
                <button onclick="document.getElementById('checkout-modal').classList.add('hidden')" class="text-2xl font-bold text-gray-400 px-2">&times;</button>
            </div>

            <div id="cart-items-list" class="space-y-2 max-h-48 overflow-y-auto"></div>

            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 flex justify-between items-center">
                <span class="text-xs font-bold text-amber-950">ยอดรวมทั้งหมด</span>
                <span id="modal-total" class="text-xl font-bold text-amber-600">0 บาท</span>
            </div>

            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">ชื่อลูกค้า / เลขโต๊ะ *</label>
                    <input type="text" id="cust-name" placeholder="เช่น โต๊ะ 1 หรือ คุณจีโน่" class="w-full px-3.5 py-2 border rounded-xl text-sm outline-none focus:border-amber-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">ประเภทการสั่ง</label>
                        <select id="order-type" class="w-full px-3 py-2 border rounded-xl text-sm font-bold bg-gray-50 outline-none">
                            <option value="ทานที่ร้าน">🍽️ ทานที่ร้าน</option>
                            <option value="รับกลับบ้าน">🛍️ รับกลับบ้าน</option>
                            <option value="เดลิเวอรี่">🛵 เดลิเวอรี่</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">วิธีชำระเงิน</label>
                        <select id="pay-method" onchange="togglePaymentBox()" class="w-full px-3 py-2 border rounded-xl text-sm font-bold bg-gray-50 outline-none">
                            <option value="เงินสด">💵 จ่ายเงินสดที่ร้าน</option>
                            <option value="โอนพร้อมเพย์">📱 โอนพร้อมเพย์</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">หมายเหตุเพิ่มเติม</label>
                    <input type="text" id="order-note" placeholder="เช่น ไม่เผ็ด / แยกน้ำ / เพิ่มเข่ง" class="w-full px-3.5 py-2 border rounded-xl text-sm outline-none">
                </div>
            </div>

            <!-- กล่องพร้อมเพย์ & อ่านสลิป -->
            <div id="promptpay-box" class="hidden bg-blue-50/80 border-2 border-blue-200 rounded-2xl p-3.5 space-y-2.5 text-center">
                <span class="inline-block bg-blue-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full">PromptPay QR Code</span>
                <p class="text-xs text-slate-700">พร้อมเพย์: <strong id="pp-id-disp" class="font-mono text-blue-800">-</strong></p>
                <div id="store-qr-box" class="bg-white p-2.5 rounded-xl border border-blue-100 inline-block"></div>

                <div class="text-left bg-white p-3 rounded-xl border border-blue-200 space-y-2">
                    <label class="block text-xs font-bold text-slate-700">📎 แนบสลิปโอนเงิน (อ่าน QR สลิปอัตโนมัติ)</label>
                    <input type="file" id="slip-file-inp" accept="image/*" onchange="handleSlipScan(event)" class="block w-full text-xs text-slate-500">
                    <div id="slip-status-box" class="hidden p-2 rounded-lg text-xs font-semibold"></div>
                    <img id="slip-prev-img" src="" class="hidden w-full max-h-32 object-contain rounded-lg border">
                </div>
            </div>

            <button onclick="submitOrder()" id="btn-submit-order" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-sm shadow-md transition">
                ✅ ยืนยันส่งออเดอร์
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAhtvwqgAP-5-ITl1TIopqIWEFrZ2deQtg",
            authDomain: "sapsonghub.firebaseapp.com",
            databaseURL: "https://sapsonghub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sapsonghub",
            storageBucket: "sapsonghub.firebasestorage.app",
            messagingSenderId: "448301529212",
            appId: "1:448301529212:web:7366898a663dcbd556f1f9",
            measurementId: "G-0SPWW0K3WD"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const SHOP_ID = (urlParams.get('shop') || 'pangnawat').toLowerCase();
        document.getElementById('hdr-receipt-link').href = `receipt.html?shop=${SHOP_ID}`;

        let paymentConfig = { shopName: SHOP_ID, promptpayId: '0855750995', shopLogo: '' };
        let isStoreOpen = true;
        let menus = [];
        let selectedCat = 'ทั้งหมด';
        let cart = []; // [{ id, name, price, qty }]
        let usedSlipRefs = new Set();
        let slipBase64 = '';
        let parsedSlipRef = '';

        function isExpired(d) {
            if (!d || d === '9999-12-31') return false;
            const t = new Date(); t.setHours(0,0,0,0);
            const e = new Date(d); e.setHours(0,0,0,0);
            return t > e;
        }

        function showLock(title, msg) {
            document.getElementById('sapsong-lock-title').innerText = title;
            document.getElementById('sapsong-lock-msg').innerText = msg;
            document.getElementById('sapsong-lock-overlay').classList.remove('hidden');
        }

        db.ref('sapsong_hub_shops/' + SHOP_ID).on('value', snap => {
            const m = snap.val();
            if (!m) return showLock('ไม่พบร้านค้าในระบบ', `รหัส "${SHOP_ID}" ยังไม่ได้ลงทะเบียนใน Sapsong HUB`);
            if (m.isSuspended) return showLock('ปิดให้บริการชั่วคราว', `ร้าน "${m.name}" งดให้บริการชั่วคราว`);
            if (m.planKey !== 'lifetime' && isExpired(m.expireDate)) return showLock('ปิดให้บริการชั่วคราว', `ระบบของ "${m.name}" ปิดให้บริการชั่วคราว`);
            document.getElementById('sapsong-lock-overlay').classList.add('hidden');
            document.getElementById('hdr-title').innerText = m.name;
            document.title = m.name;
        });

        db.ref(`shops_data/${SHOP_ID}`).on('value', snap => {
            const d = snap.val() || {};
            paymentConfig = {
                shopName: (d.paymentConfig && d.paymentConfig.shopName) || SHOP_ID,
                promptpayId: (d.paymentConfig && d.paymentConfig.promptpayId) || '0855750995',
                shopLogo: (d.paymentConfig && d.paymentConfig.shopLogo) || ''
            };
            isStoreOpen = d.isStoreOpen !== undefined ? d.isStoreOpen : true;
            menus = Array.isArray(d.menus) ? d.menus : Object.values(d.menus || {});

            usedSlipRefs.clear();
            Object.values(d.orders || {}).forEach(o => {
                if (o.slipTransRef) usedSlipRefs.add(o.slipTransRef);
            });

            if (paymentConfig.shopLogo) {
                const logo = document.getElementById('hdr-logo');
                logo.src = paymentConfig.shopLogo;
                logo.classList.remove('hidden');
            }

            const stEl = document.getElementById('hdr-status');
            if (isStoreOpen) {
                stEl.innerText = '🟢 เปิดรับออเดอร์';
                stEl.className = 'text-[11px] text-emerald-300 font-semibold';
            } else {
                stEl.innerText = '🔴 ปิดรับออเดอร์ชั่วคราว';
                stEl.className = 'text-[11px] text-rose-300 font-semibold';
            }

            renderCategoryPills();
            renderMenuGrid();
        });

        function renderCategoryPills() {
            const cats = ['ทั้งหมด', ...new Set(menus.map(m => m.category || 'ทั่วไป'))];
            const el = document.getElementById('category-pills');
            el.innerHTML = cats.map(c => `
                <button onclick="selectCategory('${c.replace(/'/g, "\\'")}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold shrink-0 transition ${selectedCat === c ? 'bg-amber-500 text-slate-950' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                    ${c}
                </button>
            `).join('');
        }

        function selectCategory(c) {
            selectedCat = c;
            renderCategoryPills();
            renderMenuGrid();
        }

        function renderMenuGrid() {
            const kw = document.getElementById('search-menu').value.toLowerCase();
            const grid = document.getElementById('menu-grid');
            const filtered = menus.filter(m => {
                const cat = m.category || 'ทั่วไป';
                if (selectedCat !== 'ทั้งหมด' && cat !== selectedCat) return false;
                if (kw && !m.name.toLowerCase().includes(kw) && !cat.toLowerCase().includes(kw)) return false;
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-3 bg-white p-10 rounded-2xl border text-center text-gray-400 text-sm">ไม่พบรายการเมนูในขณะนี้</div>`;
                return;
            }

            grid.innerHTML = filtered.map(m => {
                const soldOut = m.available === false;
                const inCart = cart.find(c => String(c.id) === String(m.id));
                const qty = inCart ? inCart.qty : 0;
                return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border flex flex-col justify-between gap-3 ${soldOut ? 'opacity-60' : ''}">
                    <div>
                        <span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-full">${m.category || 'ทั่วไป'}</span>
                        <h3 class="font-bold text-slate-800 text-base mt-1.5">${m.name}</h3>
                        <p class="text-amber-600 font-bold text-sm mt-0.5">${Number(m.price).toLocaleString()} บาท</p>
                    </div>
                    <div class="flex justify-end items-center gap-2 pt-2 border-t">
                        ${soldOut
                            ? `<span class="text-xs font-bold text-red-600">สินค้าหมดชั่วคราว</span>`
                            : qty > 0
                                ? `<button onclick="changeCartQty('${m.id}', -1)" class="w-8 h-8 rounded-xl bg-gray-200 font-bold text-sm">-</button>
                                   <span class="font-bold text-sm w-6 text-center">${qty}</span>
                                   <button onclick="addToCart('${m.id}')" class="w-8 h-8 rounded-xl bg-amber-500 font-bold text-sm text-slate-950">+</button>`
                                : `<button onclick="addToCart('${m.id}')" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">+ เพิ่มลงตะกร้า</button>`
                        }
                    </div>
                </div>
            `}).join('');
        }

        function addToCart(menuId) {
            if (!isStoreOpen) return alert('ขออภัย ขณะนี้ร้านปิดรับออเดอร์ชั่วคราวครับ');
            const m = menus.find(x => String(x.id) === String(menuId));
            if (!m || m.available === false) return;
            const found = cart.find(c => String(c.id) === String(m.id));
            if (found) found.qty += 1;
            else cart.push({ id: m.id, name: m.name, price: Number(m.price) || 0, qty: 1 });
            updateCartBar();
            renderMenuGrid();
        }

        function changeCartQty(menuId, delta) {
            const idx = cart.findIndex(c => String(c.id) === String(menuId));
            if (idx === -1) return;
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            updateCartBar();
            renderMenuGrid();
            if (!document.getElementById('checkout-modal').classList.contains('hidden')) {
                if (cart.length === 0) document.getElementById('checkout-modal').classList.add('hidden');
                else renderCheckoutModalContent();
            }
        }

        function getCartTotal() {
            return cart.reduce((s, it) => s + (it.price * it.qty), 0);
        }

        function updateCartBar() {
            const bar = document.getElementById('cart-bar');
            const count = cart.reduce((s, it) => s + it.qty, 0);
            if (count === 0) {
                bar.classList.add('hidden');
                return;
            }
            bar.classList.remove('hidden');
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total-text').innerText = `${getCartTotal().toLocaleString()} บาท`;
        }

        function crc16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) crc = ((crc & 0x8000) !== 0) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        }
        function tlv(t, v) { return `${t}${v.length.toString().padStart(2,'0')}${v}`; }
        function buildPromptPayQR(id, amt) {
            const clean = String(id || '').replace(/[^0-9]/g, '');
            const target = (clean.length === 10 && clean.startsWith('0')) ? tlv('01', '0066' + clean.substring(1)) : tlv('02', clean);
            const m = tlv('00', 'A000000677010111') + target;
            let p = tlv('00','01') + tlv('01', amt>0?'12':'11') + tlv('29', m) + tlv('53','764');
            if (amt > 0) p += tlv('54', Number(amt).toFixed(2));
            p += tlv('58','TH') + '6304';
            return p + crc16(p);
        }

        function togglePaymentBox() {
            const isPP = document.getElementById('pay-method').value === 'โอนพร้อมเพย์';
            const box = document.getElementById('promptpay-box');
            box.classList.toggle('hidden', !isPP);
            if (isPP) {
                document.getElementById('pp-id-disp').innerText = paymentConfig.promptpayId;
                const qrBox = document.getElementById('store-qr-box');
                qrBox.innerHTML = '';
                new QRCode(qrBox, { text: buildPromptPayQR(paymentConfig.promptpayId, getCartTotal()), width: 155, height: 155 });
            }
        }

        function renderCheckoutModalContent() {
            const total = getCartTotal();
            document.getElementById('modal-total').innerText = `${total.toLocaleString()} บาท`;
            document.getElementById('cart-items-list').innerHTML = cart.map(it => `
                <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border text-xs">
                    <div>
                        <span class="font-bold text-slate-800">${it.name}</span>
                        <span class="text-gray-500">(${it.price.toLocaleString()} บ.)</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="changeCartQty('${it.id}', -1)" class="w-6 h-6 rounded bg-gray-200 font-bold">-</button>
                        <span class="font-bold w-5 text-center">${it.qty}</span>
                        <button onclick="changeCartQty('${it.id}', 1)" class="w-6 h-6 rounded bg-amber-200 font-bold">+</button>
                    </div>
                </div>
            `).join('');
            togglePaymentBox();
        }

        function openCheckoutModal() {
            if (cart.length === 0) return;
            slipBase64 = '';
            parsedSlipRef = '';
            document.getElementById('slip-file-inp').value = '';
            document.getElementById('slip-prev-img').classList.add('hidden');
            document.getElementById('slip-status-box').classList.add('hidden');
            renderCheckoutModalContent();
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function handleSlipScan(e) {
            const file = e.target.files[0]; if (!file) return;
            const statusBox = document.getElementById('slip-status-box');
            statusBox.className = 'p-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-700';
            statusBox.innerText = '🔍 กำลังสแกน QR สลิป...';
            statusBox.classList.remove('hidden');

            const r = new FileReader();
            r.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const sc = document.createElement('canvas');
                    const max = 1000;
                    let sw = img.width, sh = img.height;
                    if (sw > max || sh > max) {
                        if (sw > sh) { sh = Math.round(sh * max / sw); sw = max; }
                        else { sw = Math.round(sw * max / sh); sh = max; }
                    }
                    sc.width = sw; sc.height = sh;
                    const ctx = sc.getContext('2d');
                    ctx.drawImage(img, 0, 0, sw, sh);
                    const qr = jsQR(ctx.getImageData(0, 0, sw, sh).data, sw, sh);

                    const vc = document.createElement('canvas');
                    const w = 500, h = Math.round((img.height / img.width) * 500) || 500;
                    vc.width = w; vc.height = h;
                    vc.getContext('2d').drawImage(img, 0, 0, w, h);
                    slipBase64 = vc.toDataURL('image/jpeg', 0.75);
                    const prev = document.getElementById('slip-prev-img');
                    prev.src = slipBase64; prev.classList.remove('hidden');

                    if (qr && qr.data) {
                        const match = qr.data.match(/02\d{2}([A-Za-z0-9]{10,})/);
                        const ref = match ? match[1] : qr.data.slice(-16);
                        if (usedSlipRefs.has(ref)) {
                            parsedSlipRef = 'DUPLICATE';
                            statusBox.className = 'p-2 rounded-lg text-xs font-bold bg-red-100 text-red-700';
                            statusBox.innerText = '❌ สลิปนี้เคยถูกใช้ไปแล้ว';
                        } else {
                            parsedSlipRef = ref;
                            statusBox.className = 'p-2 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800';
                            statusBox.innerText = `✅ อ่าน QR สลิปสำเร็จ (${ref.slice(-8)})`;
                        }
                    } else {
                        parsedSlipRef = '';
                        statusBox.className = 'p-2 rounded-lg text-xs font-semibold bg-amber-100 text-amber-800';
                        statusBox.innerText = '⚠️ แนบสลิปแล้ว (ให้ร้านตรวจสอบสลิป)';
                    }
                };
                img.src = ev.target.result;
            };
            r.readAsDataURL(file);
        }

        function submitOrder() {
            if (!isStoreOpen) return alert('ร้านปิดรับออเดอร์อยู่ครับ');
            if (cart.length === 0) return;
            const cust = document.getElementById('cust-name').value.trim();
            if (!cust) return alert('กรุณากรอกชื่อลูกค้าหรือเลขโต๊ะครับ');
            if (parsedSlipRef === 'DUPLICATE') return alert('สลิปนี้เคยถูกใช้งานแล้วครับ');

            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            const total = getCartTotal();
            const orderObj = {
                orderId,
                customerName: cust,
                orderType: document.getElementById('order-type').value,
                paymentMethod: document.getElementById('pay-method').value,
                note: document.getElementById('order-note').value.trim(),
                items: cart.map(x => ({ name: x.name, price: x.price, qty: x.qty })),
                total,
                slipImage: slipBase64 || '',
                slipTransRef: (parsedSlipRef && parsedSlipRef !== 'DUPLICATE') ? parsedSlipRef : '',
                status: 'รอรับออเดอร์',
                createdAt: Date.now()
            };

            const btn = document.getElementById('btn-submit-order');
            btn.disabled = true;
            btn.innerText = 'กำลังส่งออเดอร์...';

            db.ref(`shops_data/${SHOP_ID}/orders`).push(orderObj).then(() => {
                cart = [];
                updateCartBar();
                renderMenuGrid();
                document.getElementById('checkout-modal').classList.add('hidden');
                alert(`ส่งออเดอร์ ${orderId} เรียบร้อยแล้วครับ!`);
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = '✅ ยืนยันส่งออเดอร์';
            });
        }
    </script>
</body>
</html>
