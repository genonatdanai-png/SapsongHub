<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สั่งอาหารออนไลน์ - Sapsong HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #pay-qr-box img, #pay-qr-box canvas { margin: 0 auto; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-28">

    <!-- Lock Gate จาก Sapsong HUB -->
    <div id="sapsong-lock-overlay" class="hidden fixed inset-0 bg-slate-950 text-white z-[99999] flex flex-col justify-center items-center text-center p-6">
        <div class="bg-slate-900 border border-slate-700 max-w-md w-full p-8 rounded-3xl shadow-2xl space-y-3">
            <div class="text-5xl">🔒</div>
            <h2 id="sapsong-lock-title" class="text-xl font-bold">ปิดให้บริการชั่วคราว</h2>
            <p id="sapsong-lock-msg" class="text-sm text-slate-400">ร้านค้านี้ปิดให้บริการชั่วคราว</p>
        </div>
    </div>

    <!-- Header หน้าร้าน -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 overflow-hidden">
                <img id="shop-logo" src="" alt="Logo" class="hidden w-11 h-11 rounded-xl object-cover bg-white border border-slate-700 shrink-0">
                <div class="truncate">
                    <h1 id="shop-title" class="text-base sm:text-lg font-bold truncate">กำลังโหลดร้านค้า...</h1>
                    <div class="flex items-center gap-2 text-xs mt-0.5">
                        <span id="store-status-badge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold">● เปิดรับออเดอร์</span>
                        <span id="table-badge" class="hidden px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 font-bold"></span>
                    </div>
                </div>
            </div>
            <a id="btn-track-order" href="receipt.html" class="hidden shrink-0 bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3 py-2 rounded-xl transition">
                🧾 บิลของฉัน
            </a>
        </div>
    </header>

    <!-- แถบค้นหา & หมวดหมู่ -->
    <div class="bg-white border-b sticky top-[68px] z-30 shadow-xs">
        <div class="max-w-3xl mx-auto px-4 py-3 space-y-2.5">
            <input type="text" id="search-input" oninput="renderMenus()" placeholder="🔍 ค้นหาเมนูอาหาร..." class="w-full px-4 py-2 bg-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-400">
            <div id="category-tabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5"></div>
        </div>
    </div>

    <!-- รายการเมนู -->
    <main class="max-w-3xl mx-auto px-4 py-4">
        <div id="closed-banner" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 p-4 rounded-2xl text-center text-sm font-bold">
            🔴 ขณะนี้ร้านปิดรับออเดอร์ชั่วคราวครับ
        </div>
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </main>

    <!-- แถบตะกร้าด้านล่าง -->
    <div id="cart-bar" class="hidden fixed bottom-0 inset-x-0 p-3.5 bg-white/95 backdrop-blur border-t shadow-[0_-4px_20px_rgba(0,0,0,0.08)] z-40">
        <div class="max-w-3xl mx-auto">
            <button onclick="openCartModal()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 px-5 rounded-2xl shadow-md flex items-center justify-between transition">
                <div class="flex items-center gap-2.5">
                    <span id="cart-count-badge" class="bg-slate-950 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-lg">0</span>
                    <span class="text-sm sm:text-base">ดูตะกร้า / สั่งอาหาร</span>
                </div>
                <span id="cart-total-bar" class="text-base sm:text-lg font-extrabold">0 บาท</span>
            </button>
        </div>
    </div>

    <!-- Modal ตะกร้า & ชำระเงิน -->
    <div id="cart-modal" onclick="this.classList.add('hidden')" class="hidden fixed inset-0 bg-black/75 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div onclick="event.stopPropagation()" class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 max-h-[92vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold text-slate-800">🛒 สรุปรายการสั่งอาหาร</h2>
                <button onclick="document.getElementById('cart-modal').classList.add('hidden')" class="text-2xl font-bold text-slate-400 px-2">&times;</button>
            </div>

            <!-- รายการในตะกร้า -->
            <div id="cart-items-list" class="divide-y max-h-52 overflow-y-auto"></div>

            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 flex justify-between items-center">
                <span class="text-sm font-bold text-amber-900">ยอดรวมทั้งหมด</span>
                <span id="cart-modal-total" class="text-xl font-extrabold text-amber-600">0 บาท</span>
            </div>

            <!-- ข้อมูลลูกค้า -->
            <div class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">ประเภทการสั่ง</label>
                        <select id="ord-type" class="w-full px-3 py-2.5 border rounded-xl font-semibold bg-slate-50 outline-none">
                            <option value="ทานที่ร้าน">🍽️ ทานที่ร้าน</option>
                            <option value="รับกลับบ้าน">🛍️ รับกลับบ้าน</option>
                            <option value="เดลิเวอรี่">🛵 เดลิเวอรี่</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">ชื่อ / เลขโต๊ะ *</label>
                        <input type="text" id="ord-customer" placeholder="เช่น โต๊ะ 3 หรือ ชื่อเล่น" class="w-full px-3 py-2.5 border rounded-xl outline-none focus:border-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">วิธีชำระเงิน</label>
                    <select id="ord-payment" onchange="togglePaymentBox()" class="w-full px-3 py-2.5 border rounded-xl font-semibold bg-slate-50 outline-none">
                        <option value="โอนพร้อมเพย์">📱 โอนพร้อมเพย์ (สแกน QR)</option>
                        <option value="เงินสด">💵 เงินสด (จ่ายหน้าร้าน/ปลายทาง)</option>
                    </select>
                </div>

                <!-- กล่อง QR พร้อมเพย์ + อัปโหลดสลิป -->
                <div id="promptpay-box" class="bg-blue-50/80 border border-blue-200 rounded-2xl p-3.5 text-center space-y-2.5">
                    <p class="text-xs font-bold text-blue-950">สแกนจ่ายพร้อมเพย์ (<span id="pp-id-text" class="font-mono">-</span>)</p>
                    <div id="pay-qr-box" class="bg-white p-2 rounded-xl border inline-block"></div>
                    <div class="text-left bg-white p-3 rounded-xl border space-y-2">
                        <label class="block text-xs font-bold text-slate-700">📎 แนบสลิปโอนเงิน *</label>
                        <input type="file" id="slip-input" accept="image/*" onchange="processSlip(event)" class="block w-full text-xs text-slate-500">
                        <div id="slip-status" class="hidden p-2 rounded-lg text-xs font-semibold"></div>
                        <img id="slip-prev" src="" class="hidden w-full max-h-36 object-contain rounded-lg border">
                    </div>
                </div>
            </div>

            <button id="btn-place-order" onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl text-base shadow-md transition">
                ✅ ยืนยันการสั่งอาหาร
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAhtvwqgAP-5-ITl1TIopqIWEFrZ2deQtg",
            authDomain: "sapsonghub.firebaseapp.com",
            databaseURL: "https://sapsonghub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sapsonghub",
            storageBucket: "sapsonghub.firebasestorage.app",
            messagingSenderId: "448301529212",
            appId: "1:448301529212:web:7366898a663dcbd556f1f9",
            measurementId: "G-0SPWW0K3WD"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const SHOP_ID = (urlParams.get('shop') || 'pangnawat').toLowerCase();
        const TABLE_PARAM = urlParams.get('table') || '';

        let paymentConfig = { shopName: SHOP_ID, promptpayId: '', shopLogo: '' };
        let isStoreOpen = true;
        let menus = [];
        let cart = {}; // { menuId: qty }
        let selectedCategory = 'ALL';
        let slipBase64 = '';
        let slipTransRef = '';

        if (TABLE_PARAM) {
            const tb = document.getElementById('table-badge');
            tb.innerText = `โต๊ะ ${TABLE_PARAM}`;
            tb.classList.remove('hidden');
            document.getElementById('ord-customer').value = `โต๊ะ ${TABLE_PARAM}`;
        }

        const lastOrderKey = localStorage.getItem(`sapsong_last_order_${SHOP_ID}`);
        if (lastOrderKey) {
            const btnTrack = document.getElementById('btn-track-order');
            btnTrack.href = `receipt.html?shop=${SHOP_ID}&order=${lastOrderKey}`;
            btnTrack.classList.remove('hidden');
        }

        function isExpired(d) {
            if (!d || d === '9999-12-31') return false;
            const t = new Date(); t.setHours(0, 0, 0, 0);
            const e = new Date(d); e.setHours(0, 0, 0, 0);
            return t > e;
        }

        function showLock(title, msg) {
            document.getElementById('sapsong-lock-title').innerText = title;
            document.getElementById('sapsong-lock-msg').innerText = msg;
            document.getElementById('sapsong-lock-overlay').classList.remove('hidden');
        }

        // ตรวจสอบสิทธิ์จาก Sapsong HUB
        db.ref('sapsong_hub_shops/' + SHOP_ID).on('value', snap => {
            const m = snap.val();
            if (!m) return showLock('ไม่พบร้านค้าในระบบ', `รหัส "${SHOP_ID}" ยังไม่ได้ลงทะเบียนใน Sapsong HUB`);
            if (m.isSuspended) return showLock('ปิดให้บริการชั่วคราว', `ร้าน "${m.name}" ถูกระงับการใช้งานชั่วคราว`);
            if (m.planKey !== 'lifetime' && isExpired(m.expireDate)) return showLock('หมดอายุการใช้งาน', `ร้าน "${m.name}" หมดอายุแพ็กเกจแล้ว`);
            document.getElementById('sapsong-lock-overlay').classList.add('hidden');
        });

        // โหลดข้อมูลร้านค้า
        db.ref(`shops_data/${SHOP_ID}`).on('value', snap => {
            const d = snap.val() || {};
            paymentConfig = {
                shopName: (d.paymentConfig && d.paymentConfig.shopName) || SHOP_ID,
                promptpayId: (d.paymentConfig && d.paymentConfig.promptpayId) || '',
                shopLogo: (d.paymentConfig && d.paymentConfig.shopLogo) || ''
            };
            isStoreOpen = d.isStoreOpen !== undefined ? d.isStoreOpen : true;
            menus = Array.isArray(d.menus) ? d.menus : Object.values(d.menus || {});

            document.title = `${paymentConfig.shopName} - สั่งอาหารออนไลน์`;
            document.getElementById('shop-title').innerText = paymentConfig.shopName;

            if (paymentConfig.shopLogo) {
                const logo = document.getElementById('shop-logo');
                logo.src = paymentConfig.shopLogo;
                logo.classList.remove('hidden');
            }

            const statusBadge = document.getElementById('store-status-badge');
            const closedBanner = document.getElementById('closed-banner');
            if (isStoreOpen) {
                statusBadge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold';
                statusBadge.innerText = '● เปิดรับออเดอร์';
                closedBanner.classList.add('hidden');
            } else {
                statusBadge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-red-500/20 text-red-300 font-semibold';
                statusBadge.innerText = '● ปิดร้านชั่วคราว';
                closedBanner.classList.remove('hidden');
            }

            renderCategories();
            renderMenus();
            updateCartUI();
        });

        function renderCategories() {
            const cats = ['ALL', ...new Set(menus.map(m => m.category || 'ทั่วไป'))];
            const el = document.getElementById('category-tabs');
            el.innerHTML = cats.map(c => {
                const active = c === selectedCategory;
                return `<button onclick="selectCategory('${c}')" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition ${active ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${c === 'ALL' ? 'ทั้งหมด' : c}</button>`;
            }).join('');
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            renderMenus();
        }

        function renderMenus() {
            const kw = (document.getElementById('search-input').value || '').toLowerCase();
            const grid = document.getElementById('menu-grid');
            const list = menus.filter(m => {
                if (selectedCategory !== 'ALL' && (m.category || 'ทั่วไป') !== selectedCategory) return false;
                if (kw && !String(m.name || '').toLowerCase().includes(kw)) return false;
                return true;
            });

            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm bg-white rounded-2xl border">ยังไม่มีเมนูในหมวดนี้</div>`;
                return;
            }

            grid.innerHTML = list.map(m => {
                const avail = m.available !== false;
                const qty = cart[m.id] || 0;
                return `
                <div class="bg-white p-3.5 rounded-2xl border shadow-xs flex justify-between items-center gap-3 ${!avail ? 'opacity-50' : ''}">
                    <div class="min-w-0">
                        <span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">${m.category || 'ทั่วไป'}</span>
                        <h3 class="font-bold text-slate-800 text-sm sm:text-base mt-1 truncate">${m.name}</h3>
                        <p class="text-amber-600 font-bold text-sm mt-0.5">${Number(m.price || 0).toLocaleString()} บาท</p>
                    </div>
                    <div class="shrink-0 flex items-center gap-2">
                        ${!avail || !isStoreOpen
                            ? `<span class="text-xs font-bold text-red-500 bg-red-50 px-2.5 py-1 rounded-lg">${!isStoreOpen ? 'ร้านปิด' : 'หมด'}</span>`
                            : (qty > 0
                                ? `<button onclick="changeQty('${m.id}', -1)" class="w-8 h-8 rounded-xl bg-slate-200 hover:bg-slate-300 font-bold text-slate-800">-</button>
                                   <span class="w-6 text-center font-bold text-sm">${qty}</span>
                                   <button onclick="changeQty('${m.id}', 1)" class="w-8 h-8 rounded-xl bg-amber-500 hover:bg-amber-600 font-bold text-slate-950">+</button>`
                                : `<button onclick="changeQty('${m.id}', 1)" class="px-3.5 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold">+ เพิ่ม</button>`)
                        }
                    </div>
                </div>`;
            }).join('');
        }

        function changeQty(menuId, delta) {
            if (!isStoreOpen) return;
            const next = (cart[menuId] || 0) + delta;
            if (next <= 0) delete cart[menuId];
            else cart[menuId] = next;
            renderMenus();
            updateCartUI();
        }

        function getCartSummary() {
            let count = 0, total = 0, items = [];
            Object.entries(cart).forEach(([id, qty]) => {
                const m = menus.find(x => String(x.id) === String(id));
                if (m && qty > 0) {
                    count += qty;
                    total += (Number(m.price) || 0) * qty;
                    items.push({ id: m.id, name: m.name, price: Number(m.price) || 0, qty });
                }
            });
            return { count, total, items };
        }

        function updateCartUI() {
            const { count, total } = getCartSummary();
            const bar = document.getElementById('cart-bar');
            if (count === 0) {
                bar.classList.add('hidden');
            } else {
                bar.classList.remove('hidden');
                document.getElementById('cart-count-badge').innerText = count;
                document.getElementById('cart-total-bar').innerText = `${total.toLocaleString()} บาท`;
            }
        }

        function openCartModal() {
            const { count, total, items } = getCartSummary();
            if (count === 0) return;

            document.getElementById('cart-items-list').innerHTML = items.map(it => `
                <div class="py-2.5 flex justify-between items-center gap-2 text-sm">
                    <div>
                        <p class="font-bold text-slate-800">${it.name}</p>
                        <p class="text-xs text-slate-500">${it.price.toLocaleString()} บ. x ${it.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-slate-800">${(it.price * it.qty).toLocaleString()} บ.</span>
                        <button onclick="changeQty('${it.id}', -1); openCartModal();" class="w-6 h-6 rounded bg-slate-200 font-bold text-xs">-</button>
                        <button onclick="changeQty('${it.id}', 1); openCartModal();" class="w-6 h-6 rounded bg-amber-200 font-bold text-xs">+</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('cart-modal-total').innerText = `${total.toLocaleString()} บาท`;
            togglePaymentBox();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function crc16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) crc = ((crc & 0x8000) !== 0) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
            }
            return crc.toString(16).toUpperCase().padStart(4, '0');
        }
        function tlv(t, v) { return `${t}${v.length.toString().padStart(2, '0')}${v}`; }
        function buildPromptPayQR(id, amt) {
            const clean = String(id || '').replace(/[^0-9]/g, '');
            const target = (clean.length === 10 && clean.startsWith('0')) ? tlv('01', '0066' + clean.substring(1)) : tlv('02', clean);
            const m = tlv('00', 'A000000677010111') + target;
            let p = tlv('00', '01') + tlv('01', amt > 0 ? '12' : '11') + tlv('29', m) + tlv('53', '764');
            if (amt > 0) p += tlv('54', Number(amt).toFixed(2));
            p += tlv('58', 'TH') + '6304';
            return p + crc16(p);
        }

        function togglePaymentBox() {
            const method = document.getElementById('ord-payment').value;
            const box = document.getElementById('promptpay-box');
            const { total } = getCartSummary();

            if (method === 'โอนพร้อมเพย์' && paymentConfig.promptpayId) {
                box.classList.remove('hidden');
                document.getElementById('pp-id-text').innerText = paymentConfig.promptpayId;
                const qrBox = document.getElementById('pay-qr-box');
                qrBox.innerHTML = '';
                if (total > 0) new QRCode(qrBox, { text: buildPromptPayQR(paymentConfig.promptpayId, total), width: 150, height: 150 });
            } else {
                box.classList.add('hidden');
            }
        }

        function processSlip(e) {
            const file = e.target.files[0];
            if (!file) return;
            const st = document.getElementById('slip-status');
            st.className = 'p-2 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700';
            st.innerText = '🔍 กำลังสแกน QR สลิป...';
            st.classList.remove('hidden');

            const r = new FileReader();
            r.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const sc = document.createElement('canvas');
                    const max = 1000;
                    let sw = img.width, sh = img.height;
                    if (sw > max || sh > max) {
                        if (sw > sh) { sh = Math.round(sh * max / sw); sw = max; }
                        else { sw = Math.round(sw * max / sh); sh = max; }
                    }
                    sc.width = sw; sc.height = sh;
                    const ctx = sc.getContext('2d');
                    ctx.drawImage(img, 0, 0, sw, sh);
                    const qr = jsQR(ctx.getImageData(0, 0, sw, sh).data, sw, sh);

                    const vc = document.createElement('canvas');
                    const w = 500, h = Math.round((img.height / img.width) * 500) || 500;
                    vc.width = w; vc.height = h;
                    vc.getContext('2d').drawImage(img, 0, 0, w, h);
                    slipBase64 = vc.toDataURL('image/jpeg', 0.75);
                    const prev = document.getElementById('slip-prev');
                    prev.src = slipBase64;
                    prev.classList.remove('hidden');

                    if (qr && qr.data) {
                        const m = qr.data.match(/02\d{2}([A-Za-z0-9]{10,})/);
                        slipTransRef = m ? m[1] : qr.data.slice(-16);
                        st.className = 'p-2 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800';
                        st.innerText = `✅ อ่าน QR สลิปผ่าน (Ref: ${slipTransRef.slice(-8)})`;
                    } else {
                        slipTransRef = '';
                        st.className = 'p-2 rounded-lg text-xs font-semibold bg-amber-100 text-amber-800';
                        st.innerText = '⚠️ แนบสลิปแล้ว (ร้านจะตรวจสอบสลิปให้)';
                    }
                };
                img.src = ev.target.result;
            };
            r.readAsDataURL(file);
        }

        function submitOrder() {
            const { count, total, items } = getCartSummary();
            if (count === 0) return;

            const customerName = document.getElementById('ord-customer').value.trim();
            if (!customerName) return alert('กรุณากรอกชื่อหรือเลขโต๊ะครับ');

            const orderType = document.getElementById('ord-type').value;
            const paymentMethod = document.getElementById('ord-payment').value;
            if (paymentMethod === 'โอนพร้อมเพย์' && paymentConfig.promptpayId && !slipBase64) {
                return alert('กรุณาแนบสลิปโอนเงินก่อนยืนยันครับ');
            }

            const btn = document.getElementById('btn-place-order');
            btn.disabled = true;
            btn.innerText = 'กำลังส่งออเดอร์...';

            const orderData = {
                orderId: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customerName,
                orderType,
                paymentMethod,
                items: items.map(x => ({ name: x.name, price: x.price, qty: x.qty })),
                total,
                slipImage: paymentMethod === 'โอนพร้อมเพย์' ? slipBase64 : '',
                slipTransRef: paymentMethod === 'โอนพร้อมเพย์' ? slipTransRef : '',
                status: 'กำลังทำ',
                createdAt: Date.now()
            };

            const newRef = db.ref(`shops_data/${SHOP_ID}/orders`).push();
            newRef.set(orderData).then(() => {
                localStorage.setItem(`sapsong_last_order_${SHOP_ID}`, newRef.key);
                cart = {};
                slipBase64 = '';
                slipTransRef = '';
                document.getElementById('cart-modal').classList.add('hidden');
                window.location.href = `receipt.html?shop=${SHOP_ID}&order=${newRef.key}`;
            }).catch(err => {
                alert('ส่งออเดอร์ไม่สำเร็จ: ' + err.message);
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = '✅ ยืนยันการสั่งอาหาร';
            });
        }
    </script>
</body>
</html>
