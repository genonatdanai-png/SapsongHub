<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ใบเสร็จ & สถานะออเดอร์ - Sapsong HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        @media print {
            body { background: #ffffff !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .receipt-paper { box-shadow: none !important; border: none !important; max-width: 100% !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-3">

    <!-- Lock Gate จาก Sapsong HUB -->
    <div id="sapsong-lock-overlay" class="hidden fixed inset-0 bg-slate-950 text-white z-[99999] flex flex-col justify-center items-center text-center p-6">
        <div class="bg-slate-900 border border-slate-700 max-w-md w-full p-8 rounded-3xl shadow-2xl space-y-3">
            <div class="text-5xl">🔒</div>
            <h2 id="sapsong-lock-title" class="text-xl font-bold">ปิดให้บริการชั่วคราว</h2>
            <p id="sapsong-lock-msg" class="text-sm text-slate-400">ระบบใบเสร็จของร้านนี้ปิดให้บริการชั่วคราว</p>
        </div>
    </div>

    <div class="max-w-md mx-auto space-y-4">

        <!-- แถบปุ่มด้านบน (ซ่อนตอนสั่งพิมพ์) -->
        <div class="flex justify-between items-center gap-2 no-print">
            <a id="back-shop-btn" href="index.html" class="bg-white hover:bg-gray-50 text-slate-700 border px-3.5 py-2 rounded-xl text-xs font-bold shadow-2xs transition">
                ← กลับหน้าร้าน
            </a>
            <button onclick="window.print()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-2xs transition">
                🖨️ พิมพ์ใบเสร็จ
            </button>
        </div>

        <!-- ช่องค้นหา / เลือกบิล -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border space-y-2.5 no-print">
            <label class="block text-xs font-bold text-slate-700">🔎 เลือกบิล หรือ พิมพ์รหัสบิล / ชื่อลูกค้า / โต๊ะ</label>
            <div class="flex gap-2">
                <input type="text" id="search-receipt" oninput="renderSelectedReceipt()" placeholder="เช่น ORD-1234 หรือ โต๊ะ 1" class="flex-1 px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-amber-500">
                <select id="receipt-select" onchange="onSelectReceiptChange()" class="px-2.5 py-2 border rounded-xl text-xs font-bold bg-gray-50 outline-none max-w-[155px]">
                    <option value="">-- บิลล่าสุด --</option>
                </select>
            </div>
        </div>

        <!-- กระดาษใบเสร็จ -->
        <div id="print-area" class="receipt-paper bg-white rounded-3xl shadow-lg border p-5 sm:p-6 space-y-4">
            <div class="text-center border-b border-dashed pb-4 space-y-1.5">
                <img id="rc-logo" src="" alt="Logo" class="hidden w-14 h-14 rounded-2xl object-cover mx-auto border">
                <h1 id="rc-shop-name" class="text-lg font-bold text-slate-900">กำลังโหลดชื่อร้าน...</h1>
                <p id="rc-order-id" class="text-xs font-mono font-bold text-amber-700">-</p>
                <p id="rc-time" class="text-[11px] text-gray-400">-</p>
            </div>

            <div class="bg-slate-50 rounded-2xl p-3 text-xs space-y-1 border">
                <div class="flex justify-between">
                    <span class="text-gray-500">ลูกค้า / โต๊ะ:</span>
                    <strong id="rc-customer" class="text-slate-800">-</strong>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">ประเภท:</span>
                    <span id="rc-type" class="font-semibold text-slate-700">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">การชำระเงิน:</span>
                    <span id="rc-payment" class="font-semibold text-slate-700">-</span>
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-gray-500">สถานะบิล:</span>
                    <span id="rc-status" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">-</span>
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between text-[11px] font-bold text-gray-400 border-b pb-1">
                    <span>รายการ</span>
                    <span>รวม</span>
                </div>
                <div id="rc-items-list" class="space-y-2 text-xs">
                    <p class="text-center text-gray-400 py-6">กำลังโหลดรายการบิล...</p>
                </div>
            </div>

            <div id="rc-note-box" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-xs text-amber-900">
                <strong>หมายเหตุ:</strong> <span id="rc-note-text"></span>
            </div>

            <div class="border-t border-dashed pt-3 flex justify-between items-baseline">
                <span class="text-sm font-bold text-slate-800">ยอดสุทธิ</span>
                <span id="rc-total" class="text-2xl font-bold text-amber-600">0 บาท</span>
            </div>

            <div class="text-center pt-2 border-t border-dashed">
                <p id="rc-footer" class="text-xs text-gray-500">ขอบคุณที่มาอุดหนุนครับ</p>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAhtvwqgAP-5-ITl1TIopqIWEFrZ2deQtg",
            authDomain: "sapsonghub.firebaseapp.com",
            databaseURL: "https://sapsonghub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sapsonghub",
            storageBucket: "sapsonghub.firebasestorage.app",
            messagingSenderId: "448301529212",
            appId: "1:448301529212:web:7366898a663dcbd556f1f9",
            measurementId: "G-0SPWW0K3WD"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const SHOP_ID = (urlParams.get('shop') || 'pangnawat').toLowerCase();
        document.getElementById('back-shop-btn').href = `index.html?shop=${SHOP_ID}`;

        let paymentConfig = { shopName: SHOP_ID, shopLogo: '', receiptFooter: 'ขอบคุณที่มาอุดหนุนครับ' };
        let ordersList = [];
        let selectedKey = '';

        function isExpired(d) {
            if (!d || d === '9999-12-31') return false;
            const t = new Date(); t.setHours(0,0,0,0);
            const e = new Date(d); e.setHours(0,0,0,0);
            return t > e;
        }

        function showLock(title, msg) {
            document.getElementById('sapsong-lock-title').innerText = title;
            document.getElementById('sapsong-lock-msg').innerText = msg;
            document.getElementById('sapsong-lock-overlay').classList.remove('hidden');
        }

        db.ref('sapsong_hub_shops/' + SHOP_ID).on('value', snap => {
            const m = snap.val();
            if (!m) return showLock('ไม่พบร้านค้าในระบบ', `รหัส "${SHOP_ID}" ยังไม่ได้ลงทะเบียนใน Sapsong HUB`);
            if (m.isSuspended) return showLock('ปิดให้บริการชั่วคราว', `ร้าน "${m.name}" งดให้บริการชั่วคราว`);
            if (m.planKey !== 'lifetime' && isExpired(m.expireDate)) return showLock('ปิดให้บริการชั่วคราว', `ระบบของ "${m.name}" ปิดให้บริการชั่วคราว`);
            document.getElementById('sapsong-lock-overlay').classList.add('hidden');
        });

        db.ref(`shops_data/${SHOP_ID}`).on('value', snap => {
            const d = snap.val() || {};
            const cfg = d.paymentConfig || {};
            paymentConfig = {
                shopName: cfg.shopName || SHOP_ID,
                shopLogo: cfg.shopLogo || '',
                receiptFooter: cfg.receiptFooter || 'ขอบคุณที่มาอุดหนุนครับ'
            };

            document.getElementById('rc-shop-name').innerText = paymentConfig.shopName;
            document.getElementById('rc-footer').innerText = paymentConfig.receiptFooter;
            if (paymentConfig.shopLogo) {
                const logo = document.getElementById('rc-logo');
                logo.src = paymentConfig.shopLogo;
                logo.classList.remove('hidden');
            }

            ordersList = Object.entries(d.orders || {}).map(([k, v]) => ({
                ...v,
                key: k,
                items: Array.isArray(v.items) ? v.items : []
            })).reverse();

            populateReceiptSelect();
            renderSelectedReceipt();
        });

        function populateReceiptSelect() {
            const sel = document.getElementById('receipt-select');
            const prevVal = selectedKey || sel.value;
            sel.innerHTML = `<option value="">-- บิลล่าสุด --</option>` + ordersList.map(o =>
                `<option value="${o.key}">${o.orderId || o.key.slice(-4)} (${o.customerName || 'ลูกค้า'})</option>`
            ).join('');
            if (prevVal && ordersList.some(o => o.key === prevVal)) {
                sel.value = prevVal;
            }
        }

        function onSelectReceiptChange() {
            selectedKey = document.getElementById('receipt-select').value;
            renderSelectedReceipt();
        }

        function renderSelectedReceipt() {
            const kw = document.getElementById('search-receipt').value.trim().toLowerCase();
            let target = null;

            if (kw) {
                target = ordersList.find(o =>
                    String(o.orderId || '').toLowerCase().includes(kw) ||
                    String(o.customerName || '').toLowerCase().includes(kw) ||
                    String(o.key || '').toLowerCase().includes(kw)
                );
            } else if (selectedKey) {
                target = ordersList.find(o => o.key === selectedKey);
            } else {
                target = ordersList[0] || null;
            }

            if (!target) {
                document.getElementById('rc-order-id').innerText = 'ไม่พบข้อมูลบิล';
                document.getElementById('rc-items-list').innerHTML = `<p class="text-center text-gray-400 py-6">ไม่พบบิลที่ค้นหา</p>`;
                document.getElementById('rc-total').innerText = '0 บาท';
                return;
            }

            selectedKey = target.key;
            document.getElementById('rc-order-id').innerText = `เลขที่บิล: ${target.orderId || target.key.slice(-6)}`;
            document.getElementById('rc-time').innerText = target.createdAt
                ? new Date(target.createdAt).toLocaleString('th-TH')
                : '-';
            document.getElementById('rc-customer').innerText = target.customerName || 'ลูกค้า';
            document.getElementById('rc-type').innerText = target.orderType || 'ทานที่ร้าน';
            document.getElementById('rc-payment').innerText = target.paymentMethod || 'เงินสด';

            const stEl = document.getElementById('rc-status');
            const stText = target.status || 'รอรับออเดอร์';
            stEl.innerText = stText;
            stEl.className = stText === 'เสร็จแล้ว'
                ? 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700'
                : 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800';

            const itemsHtml = (target.items || []).map(it => {
                const qty = Number(it.qty || 1);
                const price = Number(it.price || 0);
                return `
                <div class="flex justify-between items-start gap-2">
                    <div>
                        <p class="font-bold text-slate-800">${it.name}</p>
                        <p class="text-[11px] text-gray-400">${price.toLocaleString()} x ${qty}</p>
                    </div>
                    <span class="font-bold text-slate-800 shrink-0">${(price * qty).toLocaleString()} บ.</span>
                </div>
            `;
            }).join('');

            document.getElementById('rc-items-list').innerHTML = itemsHtml || `<p class="text-center text-gray-400 py-4">ไม่มีรายการสินค้า</p>`;

            const noteBox = document.getElementById('rc-note-box');
            if (target.note) {
                document.getElementById('rc-note-text').innerText = target.note;
                noteBox.classList.remove('hidden');
            } else {
                noteBox.classList.add('hidden');
            }

            const calcTotal = (target.items || []).reduce((s, it) => s + (Number(it.price || 0) * Number(it.qty || 1)), 0);
            const totalVal = target.total !== undefined ? Number(target.total) : calcTotal;
            document.getElementById('rc-total').innerText = `${totalVal.toLocaleString()} บาท`;
        }
    </script>
</body>
</html>
